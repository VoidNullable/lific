name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Restore the Devenv toolchain
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Source edits reuse the toolchain; Nix validates fallback store paths.
          primary-key: devenv-tools-${{ runner.os }}-${{ runner.arch }}-check-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix') }}
          restore-prefixes-first-match: devenv-tools-${{ runner.os }}-${{ runner.arch }}-check-
          paths: ~/.cache/nix
          # Keep rooted tools, discard temporary evaluation/build inputs before saving.
          gc-max-store-size: 0
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - name: Prepare the Devenv environment
        run: devenv shell -- true
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: devenv shell -- {0}
          # The locked environment supplies Rust. Ignore unrelated host rustup
          # toolchains when forming the key, and allow this PR to warm its cache.
          prefix-key: devenv-rust-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix', 'Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}
          shared-key: linux-debug-check
          add-rust-environment-hash-key: false
          cache-bin: false
          cache-workspace-crates: true
      - name: Run project, hook, and documentation checks
        run: devenv tasks run lific:check devenv:git-hooks:run lific:docs:check
      - name: Run the browser task graph
        run: devenv --profile e2e tasks run lific:e2e
      - name: Retain native-link browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-link-traces
          path: /tmp/lific-native-links-*/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  windows:
    # Keep native Windows compilation, Clippy, and tests as a CI gate while
    # the release workflow transitions to a dedicated MSVC build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist
        shell: bash

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets
