name: Dependency drift

# CI and release builds use Cargo.lock, but `cargo install lific` ignores it
# and resolves the newest versions Cargo.toml allows. A dependency that breaks
# its API within a semver range (rmcp 1.7 did, breaking 2.10.0 on crates.io)
# passes every locked check while the published crate fails to install. This
# builds against a fresh resolution, and runs weekly because drift happens
# between pushes.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fresh-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the newest versions Cargo.toml allows
        # Prints each package that moved, so a failure names its suspects.
        run: cargo update
      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist
      - name: Check against the fresh resolution
        run: cargo check --all-targets
